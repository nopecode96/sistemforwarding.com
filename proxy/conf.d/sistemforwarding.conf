# Upstream Next.js Application Container
upstream nextjs_upstream {
    server app:3000;
    keepalive 32;
}

# HTTP: Handles apex domain, www, admin, and all tenant subdomains (*.sistemforwarding.com)
server {
    listen 80;
    listen [::]:80;
    server_name sistemforwarding.com *.sistemforwarding.com localhost 127.0.0.1;

    # Production grade payload limit for freight forwarding documents (BL, AWB, manifests, invoices)
    client_max_body_size 50M;

    # Security headers
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Health check probe for container orchestrator / uptime monitors
    location /healthz {
        access_log off;
        return 200 "OK\n";
    }

    # Proxy all traffic to Next.js App Router container
    location / {
        proxy_pass http://nextjs_upstream;
        proxy_http_version 1.1;

        # WebSocket support (for Next.js HMR in dev and real-time operational events)
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Forward full host header and client network metadata for multi-tenant extraction
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;

        # Resilient timeout thresholds
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
        proxy_buffering off;
    }
}
