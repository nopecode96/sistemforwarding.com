services:
  # ============================================================================
  # 1. POSTGRESQL 16 (Primary Relational Database)
  # ============================================================================
  postgres:
    image: postgres:16-alpine
    container_name: sf_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-sistemforwarding_db}
      POSTGRES_USER: ${POSTGRES_USER:-sf_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sf_prod_secure_pg_pass_2026}
    volumes:
      - ./data/database:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-sf_admin} -d ${POSTGRES_DB:-sistemforwarding_db}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - sf_net

  # ============================================================================
  # 2. REDIS (Caching, Session, and Ultra-Fast Tenant Resolution)
  # ============================================================================
  redis:
    image: redis:7-alpine
    container_name: sf_redis
    restart: unless-stopped
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-sf_prod_secure_redis_pass_2026}
    command: ["sh", "-c", "exec redis-server --appendonly yes --requirepass \"$$REDIS_PASSWORD\""]
    volumes:
      - ./data/redis:/data
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a ${REDIS_PASSWORD:-sf_prod_secure_redis_pass_2026} ping | grep PONG"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - sf_net

  # ============================================================================
  # 3. NEXT.JS MULTI-TENANT WEB APPLICATION
  # ============================================================================
  app:
    container_name: sf_app
    restart: unless-stopped
    build:
      context: ./app
      dockerfile: Dockerfile
    environment:
      NODE_ENV: production
      DATABASE_URL: ${DATABASE_URL:-postgresql://sf_admin:sf_prod_secure_pg_pass_2026@postgres:5432/sistemforwarding_db?schema=public}
      REDIS_URL: ${REDIS_URL:-redis://:sf_prod_secure_redis_pass_2026@redis:6379}
      APP_DOMAIN: ${APP_DOMAIN:-sistemforwarding.com}
      NEXT_PUBLIC_APP_DOMAIN: ${NEXT_PUBLIC_APP_DOMAIN:-sistemforwarding.com}
      NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-https://sistemforwarding.com}
      BORDERPAY_API_KEY_LIVE: ${BORDERPAY_API_KEY_LIVE}
      BORDERPAY_API_KEY_TEST: ${BORDERPAY_API_KEY_TEST}
      BORDERPAY_VERIFICATION_TOKEN: ${BORDERPAY_VERIFICATION_TOKEN}
      BORDERPAY_WEBHOOK_URL: ${BORDERPAY_WEBHOOK_URL}
      HOSTINGER_API_TOKEN: ${HOSTINGER_API_TOKEN}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      NEXT_PUBLIC_GOOGLE_CLIENT_ID: ${NEXT_PUBLIC_GOOGLE_CLIENT_ID}
      PORT: 3000
    expose:
      - "3000"
    volumes:
      - ./app/public/uploads:/app/public/uploads
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - sf_net

  # ============================================================================
  # 4. NGINX (Reverse Proxy & Wildcard Subdomain Handler)
  # ============================================================================
  nginx:
    image: nginx:alpine
    container_name: sf_nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./proxy/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./proxy/conf.d:/etc/nginx/conf.d:ro
      - ./proxy/certs:/etc/nginx/certs:ro
      - ./logs/nginx:/var/log/nginx
    depends_on:
      - app
    networks:
      - sf_net

networks:
  sf_net:
    driver: bridge
